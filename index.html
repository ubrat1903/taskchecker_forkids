<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>きょうの やること</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon192.png">
<link rel="apple-touch-icon" href="icon180.png">
<meta name="theme-color" content="#FFF8EF">
<style>
  :root {
    --bg: #FDF8F0;
    --card: #FFFFFF;
    --ink: #3A3A3A;
    --ink-2: #767676;
    --ink-3: #A5A5A5;
    --line: #E8E2D8;
    --done: #2F9E63;
    --done-bg: #E9F7EF;
    --accent: #4A7FD4;
    --accent-bg: #EDF3FC;
    --undone: #ECECEC;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 14px 14px 24px;
    max-width: 480px;
    margin: 0 auto;
    user-select: none;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  #dateLabel { font-size: 15px; color: var(--ink-2); font-weight: 600; }
  #clock { font-size: 34px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  #gearBtn {
    width: 44px; height: 44px; border: none; background: transparent;
    font-size: 22px; color: var(--ink-3); border-radius: 50%;
  }
  #gearBtn:active { background: var(--line); }

  /* ---------- allowance (おこづかい) ---------- */
  #allowance {
    text-align: center; margin-left: auto; margin-right: 10px;
    background: #FFF6DC; border: 1px solid #F2DFA8;
    border-radius: 14px; padding: 6px 12px; min-width: 96px;
  }
  #allowance .al-label { font-size: 11px; font-weight: 700; color: #A9853B; }
  #allowance .al-row {
    font-size: 12px; color: #8A6A1F; font-weight: 600;
    font-variant-numeric: tabular-nums; line-height: 1.35; text-align: right;
  }
  #allowance .al-row .num { font-size: 16px; font-weight: 700; }

  /* ---------- week strip ---------- */
  #weekStrip {
    display: flex; gap: 6px; justify-content: space-between;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 8px; margin-bottom: 14px;
  }
  .day { flex: 1; text-align: center; }
  .day .dow { font-size: 11px; color: var(--ink-2); margin-bottom: 4px; }
  .day .mark {
    width: 30px; height: 30px; margin: 0 auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    background: var(--undone); color: var(--ink-3);
  }
  .day.face .mark  { background: transparent; font-size: 24px; }
  .day.future      { opacity: .35; }
  .day.today .dow  { color: var(--accent); font-weight: 700; }
  .day.today .mark { box-shadow: 0 0 0 2px var(--accent); }

  /* ---------- current slot card ---------- */
  .slot-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .slot-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .slot-emoji { font-size: 26px; }
  .slot-name { font-size: 24px; font-weight: 700; }
  .slot-time { font-size: 14px; color: var(--ink-2); margin-left: auto; font-variant-numeric: tabular-nums; }

  .task {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 10px; border-radius: 14px; margin-bottom: 6px;
    border: 1px solid transparent;
    font-size: 21px; font-weight: 600; line-height: 1.3;
    min-height: 56px;
  }
  .task:active { background: var(--accent-bg); }
  .task .box {
    width: 34px; height: 34px; flex: none; border-radius: 10px;
    border: 3px solid var(--ink-3); background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: transparent; transition: all .15s;
  }
  .task.done { background: var(--done-bg); border-color: #CBE9D7; }
  .task.done .box { background: var(--done); border-color: var(--done); color: #fff; }
  .task.done .label { color: var(--done); text-decoration: line-through; text-decoration-thickness: 2px; }

  .all-done {
    text-align: center; font-size: 18px; font-weight: 700; color: var(--done);
    padding: 10px 0 2px;
  }
  .all-done .big { font-size: 34px; display: block; animation: pop .4s ease; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* stamp burst on check */
  .burst {
    position: fixed; font-size: 44px; pointer-events: none; z-index: 50;
    animation: rise .7s ease-out forwards;
  }
  @keyframes rise {
    0%   { opacity: 1; transform: translateY(0) scale(.6); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
  }

  /* ---------- next / past ---------- */
  .section-label { font-size: 13px; color: var(--ink-2); font-weight: 700; margin: 0 4px 6px; }
  .next-card {
    background: var(--accent-bg); border: 1px dashed #BCD0EE;
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px;
  }
  .next-card .slot-head { margin-bottom: 6px; }
  .next-card .slot-name { font-size: 18px; color: var(--ink-2); }
  .next-card .slot-emoji { font-size: 20px; }
  .next-tasks { font-size: 14px; color: var(--ink-2); line-height: 1.7; padding-left: 2px; }

  #pastWrap { margin-bottom: 14px; }
  #pastToggle {
    width: 100%; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); padding: 12px; font-size: 15px; font-weight: 700;
    color: var(--ink-2); font-family: inherit;
  }
  #pastBody { display: none; margin-top: 8px; }
  #pastBody.open { display: block; }
  #pastBody .slot-card { padding: 12px; }
  #pastBody .slot-name { font-size: 18px; }
  #pastBody .task { font-size: 17px; min-height: 48px; padding: 9px 8px; }
  #pastBody .task .box { width: 28px; height: 28px; border-width: 2px; font-size: 18px; }

  /* ---------- edit mode ---------- */
  #editOverlay {
    display: none; position: fixed; inset: 0; background: rgba(40,40,40,.45); z-index: 100;
    overflow-y: auto; padding: 16px;
  }
  #editOverlay.open { display: block; }
  .edit-panel {
    background: #fff; border-radius: var(--radius); max-width: 480px;
    margin: 0 auto; padding: 18px 16px 24px;
  }
  .edit-panel h2 { font-size: 18px; margin-bottom: 4px; }
  .edit-note { font-size: 12px; color: var(--ink-2); margin-bottom: 14px; }
  .edit-slot { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 12px; }
  .edit-slot-head { display: flex; gap: 6px; margin-bottom: 8px; }
  .edit-slot-head input[type="text"] { flex: 1; min-width: 0; }
  .edit-slot-head input[type="time"] { width: 118px; }
  .edit-task-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .edit-task-row input { flex: 1; min-width: 0; }
  .edit-panel input {
    font-family: inherit; font-size: 15px; padding: 8px;
    border: 1px solid #CCC; border-radius: 8px;
  }
  .edit-sec-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .edit-field {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--ink-2);
  }
  .edit-field label { flex: 1; }
  .edit-field input[type="number"] { width: 72px; text-align: right; }
  .mini-btn {
    border: none; border-radius: 8px; padding: 8px 10px; font-size: 14px;
    font-family: inherit; font-weight: 700; background: var(--undone); color: var(--ink-2);
  }
  .mini-btn.del { background: #F3F3F3; }
  .mini-btn.move { background: #EDF3FB; color: var(--accent); padding: 8px 9px; }
  .edit-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 13px; font-size: 16px;
    font-family: inherit; font-weight: 700;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--undone); color: var(--ink-2); }
  .reset-link { display: block; text-align: center; margin-top: 14px; font-size: 13px; color: var(--ink-3); background: none; border: none; text-decoration: underline; font-family: inherit; width: 100%; }
</style>
</head>
<body>

<header>
  <div>
    <div id="dateLabel">--</div>
    <div id="clock">--:--</div>
  </div>
  <div id="allowance" aria-label="おこづかい">
    <div class="al-label">💰 おこづかい</div>
    <div class="al-row">こんしゅう <span class="num" id="allowanceWeek">0</span>えん</div>
    <div class="al-row">こんげつ <span class="num" id="allowanceMonth">0</span>えん</div>
  </div>
  <button id="gearBtn" aria-label="設定">⚙️</button>
</header>

<div id="weekStrip" aria-label="この1週間のきろく"></div>

<div class="section-label" id="nowLabel">いまの やること</div>
<div id="currentSlot"></div>

<div class="section-label">つぎは</div>
<div id="nextSlot" class="next-card"></div>

<div id="pastWrap">
  <button id="pastToggle">▾ きょうの これまで（あとからチェックできるよ）</button>
  <div id="pastBody"></div>
</div>

<div id="editOverlay">
  <div class="edit-panel">
    <h2>タスクの へんしゅう（おうちの人用）</h2>
    <div class="edit-note">名前・開始時刻・タスクを変更できます。「ほぞん」で反映されます。</div>
    <div id="editSlots"></div>

    <div class="edit-slot">
      <div class="edit-sec-title">💰 おこづかい</div>
      <div class="edit-field">
        <label for="alEnabled">おこづかい機能を つかう（OFFで画面から非表示）</label>
        <input type="checkbox" id="alEnabled" style="width:22px;height:22px">
      </div>
      <div class="edit-field">
        <label for="alWeekday">平日スマイル 1日あたり</label>
        <span><input type="number" id="alWeekday" min="0" max="1000" step="1"> 円</span>
      </div>
      <div class="edit-field">
        <label for="alWkndBonus">土日（平日ぜんぶスマイルの週）</label>
        <span><input type="number" id="alWkndBonus" min="0" max="1000" step="1"> 円</span>
      </div>
      <div class="edit-field">
        <label for="alWkndNormal">土日（平日にしょんぼりがあった週）</label>
        <span><input type="number" id="alWkndNormal" min="0" max="1000" step="1"> 円</span>
      </div>
    </div>

    <div class="edit-slot">
      <div class="edit-sec-title">🔒 暗証番号</div>
      <div class="edit-field">
        <label for="pinInput">この編集画面を開く番号（数字4〜8けた）</label>
        <span><input type="tel" id="pinInput" maxlength="8" style="width:90px"></span>
      </div>
    </div>

    <div class="edit-actions">
      <button class="btn ghost" id="editCancel">やめる</button>
      <button class="btn primary" id="editSave">ほぞん</button>
    </div>
    <button class="reset-link" id="editReset">最初の設定にもどす</button>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   きょうの やること ダッシュボード（試作版）
   - チェック状態は localStorage に日付ごとに保存（直近14日保持）
   - 表示: 現在の時間帯（大）＋ 次の時間帯（小）＋ 過去分（折りたたみ）
   - 直近7日のきろくを上部に表示
   - 親向け編集モード: ⚙ → 暗証番号（初期値 1234）
   ========================================================= */

var CONFIG_KEY  = "habitConfig_v1";
var RECORDS_KEY = "habitRecords_v1";
var PIN_KEY = "habitPin_v1";
function loadPin() { return localStorage.getItem(PIN_KEY) || "1234"; } // 初期値1234。編集モードで変更可

var DEFAULT_CONFIG = {
  slots: [
    { id: "s1", emoji: "🌅", name: "あさ",     start: "06:30",
      tasks: [ {id:"t1", label:"かおを あらう"},
               {id:"t2", label:"あさごはんを たべる"},
               {id:"t3", label:"はみがきを する"},
               {id:"t4", label:"すいとうを カバンに いれる"} ] },
    { id: "s5", emoji: "🚪", name: "しゅっぱつまえ", start: "07:30",
      tasks: [ {id:"t13", label:"もちものを チェックする"},
               {id:"t14", label:"トイレを すませる"} ] },
    { id: "s2", emoji: "🎒", name: "かえったら", start: "15:30",
      tasks: [ {id:"t5", label:"てを あらう"},
               {id:"t6", label:"しゅくだいを する"},
               {id:"t7", label:"じかんわりを そろえる"} ] },
    { id: "s3", emoji: "🍚", name: "ゆうごはんのあと", start: "19:00",
      tasks: [ {id:"t8", label:"しょっきを さげる"},
               {id:"t9", label:"はみがきを する"} ] },
    { id: "s4", emoji: "🌙", name: "ねるまえ",  start: "20:30",
      tasks: [ {id:"t10", label:"あしたの ふくを だす"},
               {id:"t11", label:"トイレに いく"},
               {id:"t12", label:"9じに ふとんに はいる"} ] }
  ],
  allowance: { weekday: 10, weekendBonus: 25, weekendNormal: 10, enabled: true },
  mig_s5: true
};

/* ---------- storage ---------- */
function loadConfig() {
  try {
    var raw = localStorage.getItem(CONFIG_KEY);
    if (raw) {
      var c = JSON.parse(raw);
      if (c && c.slots && c.slots.length) {
        /* 旧バージョンの保存データへの移行処理 */
        var changed = false;
        if (!c.allowance) { c.allowance = JSON.parse(JSON.stringify(DEFAULT_CONFIG.allowance)); changed = true; }
        if (typeof c.allowance.enabled === "undefined") { c.allowance.enabled = true; changed = true; }
        if (!c.mig_s5) {
          var hasDep = c.slots.some(function (s) { return s.id === "s5" || s.name === "しゅっぱつまえ"; });
          if (!hasDep) {
            c.slots.push({ id: "s5", emoji: "🚪", name: "しゅっぱつまえ", start: "07:30",
              tasks: [ {id:"t13", label:"もちものを チェックする"}, {id:"t14", label:"トイレを すませる"} ] });
            c.slots.sort(function (a, b) { return minutesOf(a.start) - minutesOf(b.start); });
          }
          c.mig_s5 = true; changed = true;
        }
        if (changed) saveConfig(c);
        return c;
      }
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}
function saveConfig(c) { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }

function loadRecords() {
  try { var raw = localStorage.getItem(RECORDS_KEY); if (raw) return JSON.parse(raw) || {}; } catch (e) {}
  return {};
}
function saveRecords(r) { localStorage.setItem(RECORDS_KEY, JSON.stringify(r)); }

function dateKey(d) {
  var y = d.getFullYear(), m = ("0"+(d.getMonth()+1)).slice(-2), dd = ("0"+d.getDate()).slice(-2);
  return y + "-" + m + "-" + dd;
}
function pruneRecords(records) {
  var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 62); /* 月累算のため約2か月分保持 */
  var ck = dateKey(cutoff);
  Object.keys(records).forEach(function (k) { if (k < ck) delete records[k]; });
}

var config  = loadConfig();
var records = loadRecords();
pruneRecords(records); saveRecords(records);

/* ---------- time slot logic ---------- */
function minutesOf(hhmm) { var p = hhmm.split(":"); return (+p[0])*60 + (+p[1]); }
function nowMinutes() { var n = new Date(); return n.getHours()*60 + n.getMinutes(); }

function currentSlotIndex() {
  var nm = nowMinutes(), idx = -1;
  config.slots.forEach(function (s, i) { if (minutesOf(s.start) <= nm) idx = i; });
  return idx < 0 ? 0 : idx;   // 最初の時間帯より前は「あさ」を表示
}

/* ---------- record helpers ---------- */
function todayRec() {
  var k = dateKey(new Date());
  if (!records[k]) records[k] = {};
  return records[k];
}
function allTaskIds() {
  var ids = [];
  config.slots.forEach(function (s) { s.tasks.forEach(function (t) { ids.push(t.id); }); });
  return ids;
}
function dayScore(k) {
  var rec = records[k]; if (!rec) return null;
  var ids = allTaskIds(), done = 0;
  ids.forEach(function (id) { if (rec[id]) done++; });
  return { done: done, total: ids.length };
}

/* ---------- rendering ---------- */
var DOW = ["日","月","火","水","木","金","土"];

function renderClock() {
  var n = new Date();
  document.getElementById("clock").textContent =
    ("0"+n.getHours()).slice(-2) + ":" + ("0"+n.getMinutes()).slice(-2);
  document.getElementById("dateLabel").textContent =
    (n.getMonth()+1) + "月" + n.getDate() + "日（" + DOW[n.getDay()] + "）";
}

function renderWeek() {
  /* 月曜はじまりの固定表示。ぜんぶできた日=にこにこ、できなかった日=しょんぼり */
  var wrap = document.getElementById("weekStrip");
  wrap.innerHTML = "";
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var dow = (today.getDay() + 6) % 7;            /* 月=0 … 日=6 */
  for (var i = 0; i < 7; i++) {
    var d = new Date(today); d.setDate(d.getDate() - dow + i);
    var k = dateKey(d), s = dayScore(k);
    var isToday  = d.getTime() === today.getTime();
    var isFuture = d.getTime() >  today.getTime();
    var div = document.createElement("div");
    var cls = "day" + (isToday ? " today" : "") + (isFuture ? " future" : "");
    var markHtml;
    if (isFuture) { markHtml = "・"; }
    else if (s && s.total > 0 && s.done === s.total) { cls += " face"; markHtml = "😊"; }
    else if (!isToday) { cls += " face"; markHtml = "😞"; }
    else { markHtml = "・"; }                    /* きょうは 達成前なら まだ「・」 */
    div.className = cls;
    div.innerHTML = '<div class="dow">' + DOW[d.getDay()] + '</div><div class="mark">' + markHtml + '</div>';
    wrap.appendChild(div);
  }
}

function taskRow(task, compact) {
  var rec = todayRec();
  var div = document.createElement("div");
  div.className = "task" + (rec[task.id] ? " done" : "");
  div.setAttribute("role", "checkbox");
  div.setAttribute("aria-checked", rec[task.id] ? "true" : "false");
  div.innerHTML = '<div class="box">✓</div><div class="label">' + escapeHtml(task.label) + '</div>';
  div.addEventListener("click", function (ev) {
    var r = todayRec();
    r[task.id] = !r[task.id];
    saveRecords(records);
    if (r[task.id]) burst(ev.clientX || 180, ev.clientY || 300);
    renderAll(false);
  });
  return div;
}

function slotCard(slot, opts) {
  var card = document.createElement("div");
  card.className = "slot-card";
  var head = document.createElement("div");
  head.className = "slot-head";
  head.innerHTML = '<span class="slot-emoji">' + slot.emoji + '</span>' +
                   '<span class="slot-name">' + escapeHtml(slot.name) + '</span>' +
                   '<span class="slot-time">' + slot.start + '〜</span>';
  card.appendChild(head);
  slot.tasks.forEach(function (t) { card.appendChild(taskRow(t, opts && opts.compact)); });

  var rec = todayRec();
  var all = slot.tasks.length > 0 && slot.tasks.every(function (t) { return rec[t.id]; });
  if (all) {
    var doneDiv = document.createElement("div");
    doneDiv.className = "all-done";
    doneDiv.innerHTML = '<span class="big">💮</span>ぜんぶ できた！';
    card.appendChild(doneDiv);
  }
  return card;
}

function renderMain() {
  var ci = currentSlotIndex();
  var cur = config.slots[ci];
  var beforeFirst = nowMinutes() < minutesOf(config.slots[0].start);

  document.getElementById("nowLabel").textContent =
    beforeFirst ? "もうすぐ（" + cur.start + "〜）" : "いまの やること";

  var curWrap = document.getElementById("currentSlot");
  curWrap.innerHTML = "";
  curWrap.appendChild(slotCard(cur));

  /* つぎの時間帯の予告 */
  var nextWrap = document.getElementById("nextSlot");
  var ni = beforeFirst ? 1 : ci + 1;
  if (ni < config.slots.length) {
    var nx = config.slots[ni];
    nextWrap.innerHTML =
      '<div class="slot-head"><span class="slot-emoji">' + nx.emoji + '</span>' +
      '<span class="slot-name">' + escapeHtml(nx.name) + '（' + nx.start + '〜）</span></div>' +
      '<div class="next-tasks">' + nx.tasks.map(function (t) { return "・" + escapeHtml(t.label); }).join("<br>") + '</div>';
  } else {
    nextWrap.innerHTML = '<div class="slot-head"><span class="slot-emoji">⭐</span>' +
      '<span class="slot-name">きょうは これで おしまい。おつかれさま！</span></div>';
  }

  /* 過去の時間帯（折りたたみ・あとからチェック可能） */
  var pastBody = document.getElementById("pastBody");
  pastBody.innerHTML = "";
  var pastCount = 0;
  for (var i = 0; i < ci; i++) {
    if (beforeFirst) break;
    pastBody.appendChild(slotCard(config.slots[i], { compact: true }));
    pastCount++;
  }
  document.getElementById("pastWrap").style.display = pastCount ? "block" : "none";
}

/* ---------- おこづかい計算 ----------
   ルール:
   - 平日にスマイル(その日の全タスク達成) = 1日 10円
   - 平日5日ぜんぶスマイルなら、土日はボーナスチャンス: スマイルで各25円
   - 平日に1日でもしょんぼりがあれば、土日はスマイルでも各10円
   - フルスマイルの週 = 10×5 + 25×2 = 100円
   - 集計は今週(月曜はじまり)のみ。週が替わると自動的に0からスタート */
function isSmileDay(d) {
  var s = dayScore(dateKey(d));
  return !!(s && s.total > 0 && s.done === s.total);
}
function weekMondayOf(d) {
  var t = new Date(d); t.setHours(0, 0, 0, 0);
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));   /* 月=0 … 日=6 */
  return t;
}
function weekdaysAllSmile(monday) {
  for (var i = 0; i < 5; i++) {
    var d = new Date(monday); d.setDate(d.getDate() + i);
    if (!isSmileDay(d)) return false;
  }
  return true;
}
/* その日1日分の獲得額（土日はその週の平日成績でボーナス判定） */
function dayEarned(d) {
  var al = config.allowance || DEFAULT_CONFIG.allowance;
  if (!isSmileDay(d)) return 0;
  var dow = (d.getDay() + 6) % 7;
  if (dow < 5) return al.weekday;
  return weekdaysAllSmile(weekMondayOf(d)) ? al.weekendBonus : al.weekendNormal;
}
function weekAllowance() {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var monday = weekMondayOf(today), total = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday); d.setDate(d.getDate() + i);
    if (d.getTime() > today.getTime()) break;
    total += dayEarned(d);
  }
  return total;
}
/* 月の累算（1日〜今日まで。末締めで翌月1日に自動リセット） */
function monthAllowance() {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var d = new Date(today.getFullYear(), today.getMonth(), 1);
  var total = 0;
  while (d.getTime() <= today.getTime()) {
    total += dayEarned(d);
    d.setDate(d.getDate() + 1);
  }
  return total;
}

function renderAllowance() {
  var al = config.allowance || DEFAULT_CONFIG.allowance;
  var box = document.getElementById("allowance");
  if (al.enabled === false) { box.style.display = "none"; return; }
  box.style.display = "block";
  document.getElementById("allowanceWeek").textContent  = weekAllowance();
  document.getElementById("allowanceMonth").textContent = monthAllowance();
}

function renderAll(scrollTop) {
  renderClock();
  renderWeek();
  renderMain();
  renderAllowance();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function burst(x, y) {
  var stamps = ["⭐","🌸","👍","✨","💮"];
  var el = document.createElement("div");
  el.className = "burst";
  el.textContent = stamps[Math.floor(Math.random() * stamps.length)];
  el.style.left = (x - 22) + "px";
  el.style.top  = (y - 22) + "px";
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 750);
}

/* ---------- past toggle ---------- */
document.getElementById("pastToggle").addEventListener("click", function () {
  document.getElementById("pastBody").classList.toggle("open");
});

/* ---------- edit mode ---------- */
var editConfig = null;

document.getElementById("gearBtn").addEventListener("click", function () {
  var ans = prompt("おうちの人用です。暗証番号を入れてください");
  if (ans !== loadPin()) { if (ans !== null) alert("番号がちがいます"); return; }
  editConfig = JSON.parse(JSON.stringify(config));
  if (!editConfig.allowance) editConfig.allowance = JSON.parse(JSON.stringify(DEFAULT_CONFIG.allowance));
  renderEdit();
  document.getElementById("alEnabled").checked  = editConfig.allowance.enabled !== false;
  document.getElementById("alWeekday").value    = editConfig.allowance.weekday;
  document.getElementById("alWkndBonus").value  = editConfig.allowance.weekendBonus;
  document.getElementById("alWkndNormal").value = editConfig.allowance.weekendNormal;
  document.getElementById("pinInput").value     = loadPin();
  document.getElementById("editOverlay").classList.add("open");
});

/* タスクの並べ替え。端を越えると隣の時間帯へ移動する */
function moveTask(si, ti, dir) {
  var slots = editConfig.slots;
  var task = slots[si].tasks[ti];
  var nt = ti + dir;
  if (nt >= 0 && nt < slots[si].tasks.length) {
    /* 同じ時間帯の中で入れ替え */
    slots[si].tasks[ti] = slots[si].tasks[nt];
    slots[si].tasks[nt] = task;
  } else {
    /* 隣の時間帯へ移動（上=前の時間帯の末尾、下=次の時間帯の先頭） */
    var ns = si + dir;
    if (ns < 0 || ns >= slots.length) return;
    if (slots[ns].tasks.length >= 5) { alert("「" + slots[ns].name + "」は もう5個あるため移動できません"); return; }
    slots[si].tasks.splice(ti, 1);
    if (dir === -1) slots[ns].tasks.push(task);
    else slots[ns].tasks.unshift(task);
  }
  renderEdit();
}

function renderEdit() {
  var wrap = document.getElementById("editSlots");
  wrap.innerHTML = "";
  editConfig.slots.forEach(function (slot, si) {
    var box = document.createElement("div");
    box.className = "edit-slot";

    var head = document.createElement("div");
    head.className = "edit-slot-head";
    var nameIn = document.createElement("input");
    nameIn.type = "text"; nameIn.value = slot.name; nameIn.maxLength = 12;
    nameIn.addEventListener("input", function () { slot.name = nameIn.value; });
    var timeIn = document.createElement("input");
    timeIn.type = "time"; timeIn.value = slot.start;
    timeIn.addEventListener("input", function () { if (timeIn.value) slot.start = timeIn.value; });
    head.appendChild(nameIn); head.appendChild(timeIn);
    box.appendChild(head);

    slot.tasks.forEach(function (task, ti) {
      var row = document.createElement("div");
      row.className = "edit-task-row";
      var tIn = document.createElement("input");
      tIn.type = "text"; tIn.value = task.label; tIn.maxLength = 20;
      tIn.addEventListener("input", function () { task.label = tIn.value; });
      var up = document.createElement("button");
      up.className = "mini-btn move"; up.textContent = "↑";
      up.addEventListener("click", function () { moveTask(si, ti, -1); });
      var down = document.createElement("button");
      down.className = "mini-btn move"; down.textContent = "↓";
      down.addEventListener("click", function () { moveTask(si, ti, 1); });
      var del = document.createElement("button");
      del.className = "mini-btn del"; del.textContent = "✕";
      del.addEventListener("click", function () { slot.tasks.splice(ti, 1); renderEdit(); });
      row.appendChild(tIn); row.appendChild(up); row.appendChild(down); row.appendChild(del);
      box.appendChild(row);
    });

    var add = document.createElement("button");
    add.className = "mini-btn"; add.textContent = "＋ タスクを追加";
    add.addEventListener("click", function () {
      if (slot.tasks.length >= 5) { alert("1つの時間帯は5個までにしましょう"); return; }
      slot.tasks.push({ id: "t" + Date.now() + Math.floor(Math.random()*1000), label: "" });
      renderEdit();
    });
    box.appendChild(add);
    wrap.appendChild(box);
  });
}

document.getElementById("editCancel").addEventListener("click", function () {
  document.getElementById("editOverlay").classList.remove("open");
});
function readYen(id, fallback) {
  var v = parseInt(document.getElementById(id).value, 10);
  if (isNaN(v) || v < 0) return fallback;
  return Math.min(v, 1000);
}

document.getElementById("editSave").addEventListener("click", function () {
  /* 暗証番号のチェック（数字4〜8けた以外は保存させない） */
  var newPin = document.getElementById("pinInput").value.trim();
  if (!/^[0-9]{4,8}$/.test(newPin)) {
    alert("暗証番号は数字4〜8けたで入れてください");
    return;
  }
  editConfig.slots.forEach(function (s) {
    s.tasks = s.tasks.filter(function (t) { return t.label.trim() !== ""; });
  });
  editConfig.slots.sort(function (a, b) { return minutesOf(a.start) - minutesOf(b.start); });
  editConfig.allowance = {
    enabled:       document.getElementById("alEnabled").checked,
    weekday:       readYen("alWeekday",    editConfig.allowance.weekday),
    weekendBonus:  readYen("alWkndBonus",  editConfig.allowance.weekendBonus),
    weekendNormal: readYen("alWkndNormal", editConfig.allowance.weekendNormal)
  };
  config = editConfig;
  saveConfig(config);
  localStorage.setItem(PIN_KEY, newPin);
  document.getElementById("editOverlay").classList.remove("open");
  renderAll(true);
});
document.getElementById("editReset").addEventListener("click", function () {
  if (!confirm("タスクを最初の設定にもどしますか？（きろくは消えません）")) return;
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  saveConfig(config);
  document.getElementById("editOverlay").classList.remove("open");
  renderAll(true);
});

/* ---------- boot ---------- */
renderAll(true);
setInterval(function () {
  // 日付が変わったら自動的に当日のきろくに切り替わる（キーが日付のため）
  renderAll(false);
}, 30000);
</script>
